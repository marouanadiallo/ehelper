<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
>
    <th:block layout:fragment="dropdown()">
        <div id="dropdown-actions" 
            class="relative"
            x-data="{
                open: false,
                toggle() {
                   if(this.open) {
                    return this.close();
                   }
                   this.$refs.button.focus();
                   this.open = true;
                },
                close(focusAfter) {
                    if (!this.open) return;
                    this.open = false;
                    focusAfter && focusAfter.focus();
                }
            }"
            x-id="['dropdown-button']"
            @keydown.escape.prevent.stop="close($refs.button)"
            @focusin.window="!$refs.panel.contains($event.target) && close()"
        >

            <!-- Trigger button -->
            <th:block layout:fragment="trigger-content"></th:block>

            <!-- Panel -->
            <div
                x-ref="panel"
                x-show="open"
                x-transition:enter="transition ease-out duration-100"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                x-transition:leave="transition ease-in duration-75"
                x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
                @click.outside="close($refs.button)"
                :id="$id('dropdown-button')"
                class="absolute right-0 mt-1 min-w-48 w-48 bg-white origin-top-right
                    border border-granite-200 rounded-lg shadow-lg z-9999"
                style="display: none;"
            >
               
                <th:block layout:fragment="content"></th:block>
                
            </div>
        </div>
    </th:block>
</html>
