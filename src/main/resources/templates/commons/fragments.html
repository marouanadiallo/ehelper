<!DOCTYPE html>
<html lang="en"
    xmlns:th="http://www.thymeleaf.org"
>
    <!-- tag::fragment of sort button -->
    <th:block th:fragment="sortButton">
        <button type="button" class="px-1 flex flex-col items-center gap-0.2 cursor-pointer 
            hover:bg-granite-200 rounded-2xl transition-colors"
        >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 15.75 7.5-7.5 7.5 7.5" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-3">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
        </button>
    </th:block>
    <!-- endTag::fragment of sort button -->

    <!-- tag::fragment of spinner -->
    <div th:fragment="loadingSpinner(message)">
        <div class="bg-white p-6 rounded-lg flex flex-col items-center gap-4">
            <svg class="animate-spin size-8 text-granite-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-granite-700" th:text="${message}">Chargement...</p>
        </div>
    </div>
    <!-- endTag::fragment of spinner -->

    <!-- tag::fragment of success message -->
    <th:block th:fragment="successMessage(message)">
        <div class="flex flex-col items-center gap-2" role="alert">
            <span class="rounded-full p-4 bg-green-100 border border-green-500 text-green-700 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                </svg>
            </span>
            <div class="flex flex-col items-center gap-2">
                <span class="block sm:inline italic" th:text="${message}">L'opération a été réalisée avec succès.</span>
            </div>
        </div>
    </th:block>
    <!-- endTag::fragment of success message -->

    <!-- tag::fragment of error message -->
    <div th:fragment="errorMessage(message)" id="global-error" hx-swap-oob="true">
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
            <span class="block sm:inline" th:text="${message}">Une erreur est survenue lors de l'opération.</span>
        </div>
    </div>
    <!-- endTag::fragment of error message -->

    <!-- tag:: no data -->
    <th:block th:fragment="noDataFound(message)">
        <div class="flex flex-col items-center gap-2">
            <svg width="64" height="41" viewBox="0 0 64 41" xmlns="http://www.w3.org/2000/svg">
                <g transform="translate(0 1)" fill="none" fill-rule="evenodd">
                    <ellipse class="fill-granite-200" cx="32" cy="33" rx="32" ry="7" />
                    <g class="stroke-granite-200" fill-rule="nonzero">
                        <path
                            d="M55 12.76L44.854 1.258C44.367.474 43.656 0 42.907 0H21.093c-.749 0-1.46.474-1.947 1.257L9 12.761V22h46v-9.24z"
                        />
                        <path
                            d="M41.613 15.931c0-1.605.994-2.93 2.227-2.931H55v18.137C55 33.26 53.68 35 52.05 35h-40.1C10.32 35 9 33.259 9 31.137V13h11.16c1.233 0 2.227 1.323 2.227 2.928v.022c0 1.605 1.005 2.901 2.237 2.901h14.752c1.232 0 2.237-1.308 2.237-2.913v-.007z"
                            class="fill-granite-700"
                        />
                    </g>
                </g>
            </svg>
            <span class="font-medium" th:text="${message}">Aucun utilisateur trouvé.</span>
        </div>
    </th:block>
    <!-- endTag:: no data -->
</html>
