<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
>
<head>
  <title>Utilisateurs</title>
</head>

<body>
  <span layout:fragment="breadcrumb-current">Utilisateurs</span>

  <div layout:fragment="content">
    <!-- tag :: filters section -->
     <section class="rounded-2xl mb-6 flex flex-col items-center gap-2">
        <div class="relative mb-2 rounded-full bg-granite-50 ">
          <div class="absolute left-4 top-1/2 transform -translate-y-1/2">
              <svg class="search-icon w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
          </div>
          <input 
            type="text" 
            placeholder="Rechercher par prénom, nom, e-mail ou téléphone..."
            class="w-full pl-12 pr-4 py-3 rounded-full border border-granite-100
              focus:border-granite-300 focus:outline-hidden transition-all
            "
          />
        </div>
        <div class="flex justify-start items-center gap-4">
          <select name="" id="" class="border border-granite-300 rounded-lg px-3 py-2">
            <option value="">Par</option>
            <option value="">Prénom</option>
            <option value="">Nom</option>
            <option value="">E-mail</option>
            <option value="">Téléphone</option>
          </select>
        </div>
     </section>
    <!-- endTag :: filters section -->

    <!-- Header -->
    <div x-data="uploadUserBatch" class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <h1 class="text-2xl font-semibold text-granite-900">Utilisateurs</h1>

      <div class="flex items-center gap-2">
        <!-- tag :: Import button -->
        <form id="uploadUserBatchForm"
          hx-encoding="multipart/form-data"
          th:hx-post="@{/users/batch/upload}"
          hx-target="#successMessage"
          x-ref="uploadUserBatchForm"
          @submit.prevent=""
          @htmx:before-request="loading = true"
          @htmx:after-request="handleAfterUploadRequest($event)"
        >
          <label class="flex items-center gap-2 px-4 py-2 border border-granite-300 rounded-lg
            hover:bg-granite-50 transition-colors cursor-pointer text-sm font-medium text-granite-700"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
            </svg>
            <span>Importer</span>
            <input type="file" class="hidden"
              name="file"
              accept=".csv"
              th:hx-get="@{/users/batch/preview}"
              hx-trigger="click"
              hx-target="#previewUploadBatchFormContainer"
              @htmx:after-request.stop
              @htmx:before-request.stop
              @change="previewUserBatchUpload($event)"
            />
          </label>
          <div id="previewUploadBatchFormContainer"></div>
        </form>
        <!-- endTag :: Import button -->

        <!-- tag :: Add button -->
        <a th:href="@{/users/form/create}" class="flex items-center gap-2 px-4 py-2 bg-granite-700 text-white rounded-lg hover:bg-granite-800 transition-colors text-sm font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Ajouter</span>
        </a>
        <!-- endTag :: Add button -->
      </div>
    </div>

    <!-- Table -->
    <div>
      <div class="border border-granite-200 rounded-lg">
        <table id="user-table" class="w-full">
          <thead>
            <tr>
              <th class="px-6 py-3 text-left text-sm bg-granite-100 font-bold text-granite-800 flex items-center gap-1">
                <span>Prénom et nom</span>
                <th:block th:replace="~{commons/fragments :: sortButton}"></th:block>
              </th>
              <th class="px-6 py-3 text-left text-sm bg-granite-100 font-bold text-granite-800">E-mail</th>
              <th class="px-6 py-3 text-left text-sm bg-granite-100 font-bold text-granite-800">Téléphone</th>
              <th class="px-6 py-3 text-left text-sm bg-granite-100 font-bold text-granite-800">Actions</th>
            </tr>
          </thead>
  
          <!-- tag :: userTableBody -->
          <tbody hx-trigger="load, reload-users from:body" th:hx-get="@{/users/slice}"
            hx-target="this"
            hx-swap="outerHTML transition:true"
            id="userTableBody"
          >
            <tr>
              <td colspan="4" class="px-6 py-4 text-sm text-granite-900">
                <th:block th:replace="~{commons/fragments :: loadingSpinner('Chargement des utilisateurs...')}"></th:block>
              </td>
            </tr>
          </tbody>
          <!-- endTag :: userTableBody -->
        </table>

        <div class="px-6 py-3 flex items-center justify-between  border-granite-200 border-t-0">
          <div class="text-granite-700 text-sm flex items-center gap-2">
            <span>Nombre total d'utilisateurs :</span> 
            <button type="button" class="flex items-center gap-1 px-2 py-1 hover:rounded hover:bg-granite-100 transition hover:cursor-pointer">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
            <!-- tag :: totalUserCount -->
            <span id="totalUserCount"></span>
            <!-- endTag :: totalUserCount -->
          </div>
          <!-- tag :: userTablePagination -->
          <div id="userTablePagination" class="mt-4 flex justify-end items-center gap-2"></div>
          <!-- endTag :: userTablePagination -->
        </div>
      </div> 
    </div>
  </div>

  <th:block layout:fragment="scripts">
    <script th:src="${asset.get('users-index.js')}"></script>
  </th:block>
</body>
</html>
